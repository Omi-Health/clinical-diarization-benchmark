[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-diarization-benchmark"
version = "0.1.0"
description = "Auditable diarization scoring on a frozen PriMock57 subset"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["clinical_diarization*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
